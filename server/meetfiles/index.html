<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Peer Meeting App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            padding: 0;
            box-sizing: border-box;
        }
        .header {
            background-color: #2c3e50;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .room-info {
            display: flex;
            align-items: center;
        }
        input {
            padding: 8px;
            margin-right: 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        .participants {
            position: absolute;
            right: 20px;
            background-color: rgba(0,0,0,0.5);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 14px;
        }
        .video-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 10px;
            padding: 10px;
            max-width: 100%;
            box-sizing: border-box;
        }
        .video-item {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background-color: #222;
            border-radius: 8px;
            overflow: hidden;
        }
        .local-video-container {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 200px;
            height: 150px;
            z-index: 100;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .peer-name {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: rgba(0,0,0,0.5);
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #2c3e50;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .control-button {
            padding: 10px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background-color: #34495e;
            color: white;
            border: none;
            font-size: 18px;
            transition: all 0.3s;
        }
        button:disabled {
            background-color: #7f8c8d !important;
            cursor: not-allowed;
        }
        .control-button:hover:not(:disabled) {
            background-color: #2980b9;
        }
        #startButton {
            background-color: #27ae60;
        }
        #callButton {
            background-color: #2980b9;
        }
        #hangupButton {
            background-color: #e74c3c;
        }
        .status-bar {
            padding: 10px 20px;
            background-color: #ecf0f1;
            color: #2c3e50;
            text-align: center;
            font-size: 14px;
        }
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .video-container {
                grid-template-columns: repeat(auto-fill, minmax(100%, 1fr));
            }
            .local-video-container {
                width: 120px;
                height: 90px;
                bottom: 70px;
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <script>
        const RoomId='{{meet_id}}';
        const user=JSON.parse('{{user | safe}}');
        const SERVER='{{server}}';
    </script>
    <div class="container">
        <div class="header">
            <h2>Multi-Peer Meeting</h2>
            <div class="room-info">

                <span id="participantCount" class="participants">Participants: 0</span>
            </div>
        </div>

        <div id="videoGrid" class="video-container">
            <!-- Remote videos will be added here dynamically -->
        </div>

        <div class="local-video-container">
            <video id="localVideo" autoplay muted playsinline></video>
            <div class="peer-name">You</div>
        </div>

        <div class="controls">
            <button id="startButton" class="control-button">🎥</button>
            <button id="callButton" class="control-button" disabled>➕</button>
            <button id="hangupButton" class="control-button" disabled>❌</button>
            <button id="toggleAudioButton" class="control-button" disabled>🎤</button>
            <button id="toggleVideoButton" class="control-button" disabled>👁️</button>
        </div>

        <div id="status" class="status-bar"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.js"></script>
    <script src="./webrtc.js"></script>
</body>
</html>
