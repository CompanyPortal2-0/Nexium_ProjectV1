<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SFU Video Call - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #1a1a1a; color: white; }
    
    #status {
      position: fixed; top: 10px; right: 10px;
      background: rgba(0,0,0,0.8); color: white;
      padding: 10px 15px; border-radius: 5px;
      font-size: 14px; z-index: 1000;
    }
    #status.connected { background: rgba(76, 175, 80, 0.8); }
    
    #videos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 15px; padding: 20px;
      min-height: calc(100vh - 100px);
    }
    
    .video-container {
      position: relative; background: #000;
      border-radius: 8px; overflow: hidden;
      aspect-ratio: 16/9;
    }
    
    video { width: 100%; height: 100%; object-fit: cover; }
    
    .video-label {
      position: absolute; bottom: 10px; left: 10px;
      background: rgba(0,0,0,0.7); padding: 5px 10px;
      border-radius: 4px; font-size: 12px;
    }
    
    #controls {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.9); padding: 15px 20px;
      border-radius: 8px; display: flex; gap: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    
    button {
      padding: 12px 20px; border: none; border-radius: 6px;
      cursor: pointer; font-size: 14px; font-weight: 500;
      transition: all 0.3s;
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    #joinBtn { background: #4CAF50; color: white; }
    #muteBtn, #videoBtn { background: #2196F3; color: white; }
    #muteBtn.active, #videoBtn.active { background: #f44336; }
    #shareBtn { background: #FF9800; color: white; }
    #leaveBtn { background: #f44336; color: white; }
    
    #roomInput {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #2a2a2a; padding: 30px;
      border-radius: 10px; text-align: center;
      z-index: 2000; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    #roomInput.hidden { display: none; }
    #roomInput h2 { margin-bottom: 20px; color: #4CAF50; }
    #roomInput input {
      width: 300px; padding: 10px; font-size: 16px;
      border: 2px solid #444; border-radius: 5px;
      background: #1a1a1a; color: white;
      margin-bottom: 15px;
    }
    #roomInput button { width: 100%; margin-top: 10px; }
    #roomInput .info {
      margin-top: 15px; font-size: 12px; color: #888;
    }
    
    #error {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #f44336; padding: 30px;
      border-radius: 10px; text-align: center;
      z-index: 3000; display: none;
      max-width: 500px;
    }
    #error.show { display: block; }
    #error h3 { margin-bottom: 15px; }
    #error pre {
      background: rgba(0,0,0,0.3);
      padding: 10px; border-radius: 5px;
      text-align: left; overflow-x: auto;
      font-size: 11px; margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="status">🔴 Disconnected</div>
  
  <div id="error">
    <h3>⚠️ Error Loading Libraries</h3>
    <p id="errorText"></p>
    <pre id="errorDetails"></pre>
    <button onclick="location.reload()" style="margin-top: 15px; background: white; color: #f44336;">Reload Page</button>
  </div>
  
  <div id="roomInput">
    <h2>🎥 Join Video Room</h2>
    <input type="text" id="roomIdInput" placeholder="Enter Room ID" value="room-default">
    <button id="joinRoomBtn">Join Room</button>
    <div class="info">
      <div>🔒 Offline Mode</div>
      <div>Server: <span id="serverUrl"></span></div>
    </div>
  </div>
  
  <div id="videos">
    <div class="video-container">
      <video id="localVideo" autoplay muted playsinline></video>
      <div class="video-label">You (Local)</div>
    </div>
  </div>
  
  <div id="controls" style="display: none;">
    <button id="muteBtn">🎤 Mute</button>
    <button id="videoBtn">📹 Stop Video</button>
    <button id="shareBtn">🖥️ Share Screen</button>
    <button id="leaveBtn">📞 Leave</button>
  </div>

  <!-- Load libraries from LOCAL files -->
  <script src="./libs/socket.io.min.js"></script>
  <script src="./libs/mediasoup-client.js"></script>

  <script>
    // ========================================
    // CONFIGURATION - CHANGE THIS!
    // ========================================
    const SERVER_URL = 'http://localhost:3000'; // Change to your server IP (e.g., 'http://192.168.1.100:3000')
    
    // ========================================
    // CHECK LIBRARIES LOADED
    // ========================================
    function showError(message, details) {
      document.getElementById('errorText').textContent = message;
      document.getElementById('errorDetails').textContent = details || '';
      document.getElementById('error').classList.add('show');
      document.getElementById('roomInput').classList.add('hidden');
    }
    
    // Wait a moment for scripts to load
    setTimeout(() => {
      if (typeof io === 'undefined') {
        showError(
          'Socket.IO library not found!',
          'Make sure libs/socket.io.min.js exists.\n\nRun: curl -L -o libs/socket.io.min.js https://cdn.socket.io/4.6.1/socket.io.min.js'
        );
        return;
      }
      
      if (typeof mediasoupClient === 'undefined') {
        showError(
          'mediasoup-client library not found!',
          'Make sure libs/mediasoup-client.js exists.\n\nRun: curl -L -o libs/mediasoup-client.js https://unpkg.com/mediasoup-client@3.7.6/lib/index.js'
        );
        return;
      }
      
      console.log('✅ All libraries loaded successfully');
      console.log('   Socket.IO:', io.version);
      console.log('   mediasoup-client:', typeof mediasoupClient);
      
      // Initialize app
      initApp();
    }, 500);
    
    // ========================================
    // SFU CLIENT CLASS
    // ========================================
    function initApp() {
      document.getElementById('serverUrl').textContent = SERVER_URL;
      
      class SFUClient {
        constructor(serverUrl) {
          console.log('🔌 Connecting to:', serverUrl);
          this.socket = io(serverUrl, {
            transports: ['websocket', 'polling'],
          });
          
          this.device = null;
          this.roomId = null;
          this.producerTransport = null;
          this.consumerTransport = null;
          this.producers = new Map();
          this.consumers = new Map();
          this.peers = new Map();
          
          this._setupSocketListeners();
        }
        
        _setupSocketListeners() {
          this.socket.on('connect', () => {
            console.log('✅ Connected to SFU server');
            this._updateStatus('🟢 Connected', true);
          });
          
          this.socket.on('disconnect', () => {
            console.log('❌ Disconnected from SFU server');
            this._updateStatus('🔴 Disconnected', false);
          });
          
          this.socket.on('connect_error', (error) => {
            console.error('❌ Connection error:', error.message);
            this._updateStatus('🔴 Connection Error', false);
            alert('Cannot connect to server at: ' + SERVER_URL + '\n\nMake sure:\n1. Server is running (node server.js)\n2. Server URL is correct\n3. Firewall allows connection');
          });
          
          this.socket.on('peers', ({ peers }) => {
            console.log('👥 Existing peers:', peers.length);
            peers.forEach(peer => {
              this.peers.set(peer.id, peer);
            });
            
            this.socket.emit('getProducers', ({ producers }) => {
              console.log('📹 Existing producers:', producers.length);
              producers.forEach(({ producerId, peerId, kind }) => {
                this._consumeProducer(producerId, peerId, kind);
              });
            });
          });
          
          this.socket.on('newPeer', ({ peerId }) => {
            console.log('👤 New peer joined:', peerId);
            this.peers.set(peerId, { id: peerId });
          });
          
          this.socket.on('newProducer', ({ producerId, peerId, kind }) => {
            console.log('📹 New producer:', kind, 'from', peerId);
            this._consumeProducer(producerId, peerId, kind);
          });
          
          this.socket.on('consumerClosed', ({ consumerId }) => {
            console.log('❌ Consumer closed:', consumerId);
            const consumer = this.consumers.get(consumerId);
            if (consumer) {
              consumer.close();
              this.consumers.delete(consumerId);
              if (this.onStreamRemoved) {
                this.onStreamRemoved(consumerId);
              }
            }
          });
          
          this.socket.on('peerClosed', ({ peerId }) => {
            console.log('👋 Peer left:', peerId);
            this.peers.delete(peerId);
          });
        }
        
        _updateStatus(text, connected) {
          const status = document.getElementById('status');
          status.textContent = text;
          if (connected) {
            status.classList.add('connected');
          } else {
            status.classList.remove('connected');
          }
        }
        
        async join(roomId, onStreamAdded, onStreamRemoved) {
          this.roomId = roomId;
          this.onStreamAdded = onStreamAdded;
          this.onStreamRemoved = onStreamRemoved;
          
          return new Promise((resolve, reject) => {
            this.socket.emit('join', { roomId }, async ({ rtpCapabilities, error }) => {
              if (error) return reject(new Error(error));
              
              try {
                console.log('📱 Loading device...');
                this.device = new mediasoupClient.Device();
                await this.device.load({ routerRtpCapabilities: rtpCapabilities });
                
                console.log('✅ Device loaded');
                resolve();
              } catch (err) {
                console.error('❌ Device load error:', err);
                reject(err);
              }
            });
          });
        }
        
        async createTransport(producing) {
          return new Promise((resolve, reject) => {
            this.socket.emit('createWebRtcTransport', { producing, consuming: !producing }, 
              async ({ id, iceParameters, iceCandidates, dtlsParameters, error }) => {
                if (error) return reject(new Error(error));
                
                try {
                  const transport = producing
                    ? this.device.createSendTransport({ id, iceParameters, iceCandidates, dtlsParameters })
                    : this.device.createRecvTransport({ id, iceParameters, iceCandidates, dtlsParameters });
                  
                  transport.on('connect', async ({ dtlsParameters }, callback, errback) => {
                    this.socket.emit('connectWebRtcTransport', 
                      { transportId: transport.id, dtlsParameters },
                      ({ success, error }) => {
                        if (error) return errback(new Error(error));
                        callback();
                      }
                    );
                  });
                  
                  if (producing) {
                    transport.on('produce', async ({ kind, rtpParameters }, callback, errback) => {
                      this.socket.emit('produce', 
                        { transportId: transport.id, kind, rtpParameters },
                        ({ id, error }) => {
                          if (error) return errback(new Error(error));
                          callback({ id });
                        }
                      );
                    });
                  }
                  
                  transport.on('connectionstatechange', (state) => {
                    console.log(`🔌 Transport state: ${state}`);
                  });
                  
                  resolve(transport);
                } catch (err) {
                  console.error('❌ Transport error:', err);
                  reject(err);
                }
              }
            );
          });
        }
        
        async produce(stream) {
          if (!this.producerTransport) {
            console.log('📤 Creating producer transport...');
            this.producerTransport = await this.createTransport(true);
          }
          
          const tracks = stream.getTracks();
          const producers = [];
          
          for (const track of tracks) {
            try {
              const producer = await this.producerTransport.produce({ track });
              this.producers.set(track.kind, producer);
              console.log(`✅ Producing ${track.kind}`);
              producers.push(producer);
            } catch (err) {
              console.error(`❌ Error producing ${track.kind}:`, err);
            }
          }
          
          return producers;
        }
        
        async _consumeProducer(producerId, peerId, kind) {
          if (!this.consumerTransport) {
            console.log('📥 Creating consumer transport...');
            this.consumerTransport = await this.createTransport(false);
          }
          
          return new Promise((resolve, reject) => {
            this.socket.emit('consume', {
              producerId,
              rtpCapabilities: this.device.rtpCapabilities,
              transportId: this.consumerTransport.id,
            }, async ({ id, kind, rtpParameters, error }) => {
              if (error) return reject(new Error(error));
              
              try {
                const consumer = await this.consumerTransport.consume({
                  id,
                  producerId,
                  kind,
                  rtpParameters,
                });
                
                this.consumers.set(consumer.id, consumer);
                
                this.socket.emit('resumeConsumer', { consumerId: consumer.id });
                
                const stream = new MediaStream([consumer.track]);
                
                if (this.onStreamAdded) {
                  this.onStreamAdded({
                    consumerId: consumer.id,
                    peerId,
                    stream,
                    kind,
                  });
                }
                
                console.log(`✅ Consuming ${kind} from peer`);
                resolve(consumer);
              } catch (err) {
                console.error('❌ Consume error:', err);
                reject(err);
              }
            });
          });
        }
        
        async enableWebcam() {
          try {
            console.log('🎥 Requesting camera/microphone...');
            const stream = await navigator.mediaDevices.getUserMedia({
              video: { width: { ideal: 1280 }, height: { ideal: 720 } },
              audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
            });
            await this.produce(stream);
            return stream;
          } catch (err) {
            console.error('❌ Media access error:', err);
            throw err;
          }
        }
        
        async enableScreenShare() {
          try {
            console.log('🖥️ Requesting screen share...');
            const stream = await navigator.mediaDevices.getDisplayMedia({
              video: { width: { ideal: 1920 }, height: { ideal: 1080 } },
            });
            await this.produce(stream);
            stream.getVideoTracks()[0].onended = () => {
              console.log('Screen sharing stopped');
            };
            return stream;
          } catch (err) {
            console.error('❌ Screen share error:', err);
            throw err;
          }
        }
        
        muteAudio() {
          const audioProducer = this.producers.get('audio');
          if (audioProducer) {
            audioProducer.pause();
            console.log('🔇 Audio muted');
          }
        }
        
        unmuteAudio() {
          const audioProducer = this.producers.get('audio');
          if (audioProducer) {
            audioProducer.resume();
            console.log('🎤 Audio unmuted');
          }
        }
        
        disableVideo() {
          const videoProducer = this.producers.get('video');
          if (videoProducer) {
            videoProducer.pause();
            console.log('📹 Video disabled');
          }
        }
        
        enableVideo() {
          const videoProducer = this.producers.get('video');
          if (videoProducer) {
            videoProducer.resume();
            console.log('📹 Video enabled');
          }
        }
        
        leave() {
          console.log('👋 Leaving room...');
          if (this.producerTransport) this.producerTransport.close();
          if (this.consumerTransport) this.consumerTransport.close();
          this.consumers.forEach(consumer => consumer.close());
          this.consumers.clear();
          this.producers.forEach(producer => producer.close());
          this.producers.clear();
          this.socket.disconnect();
        }
      }
      
      // ========================================
      // APPLICATION CODE
      // ========================================
      let client = null;
      let isAudioMuted = false;
      let isVideoOff = false;
      
      document.getElementById('joinRoomBtn').onclick = async () => {
        const roomId = document.getElementById('roomIdInput').value.trim();
        
        if (!roomId) {
          alert('Please enter a room ID');
          return;
        }
        
        try {
          document.getElementById('joinRoomBtn').disabled = true;
          document.getElementById('joinRoomBtn').textContent = 'Joining...';
          
          console.log('🚪 Joining room:', roomId);
          client = new SFUClient(SERVER_URL);
          
          await client.join(roomId,
            ({ consumerId, peerId, stream, kind }) => {
              console.log('➕ Remote stream added');
              addRemoteVideo(consumerId, peerId, stream);
            },
            (consumerId) => {
              console.log('➖ Remote stream removed');
              removeRemoteVideo(consumerId);
            }
          );
          
          const localStream = await client.enableWebcam();
          document.getElementById('localVideo').srcObject = localStream;
          
          document.getElementById('roomInput').classList.add('hidden');
          document.getElementById('controls').style.display = 'flex';
          
          console.log('✅ Successfully joined room:', roomId);
        } catch (error) {
          alert('❌ Error joining room:\n\n' + error.message + '\n\nCheck console (F12) for details.');
          console.error('Join error:', error);
          document.getElementById('joinRoomBtn').disabled = false;
          document.getElementById('joinRoomBtn').textContent = 'Join Room';
        }
      };
      
      function addRemoteVideo(consumerId, peerId, stream) {
        // Remove if already exists
        removeRemoteVideo(consumerId);
        
        const container = document.createElement('div');
        container.className = 'video-container';
        container.id = `container-${consumerId}`;
        
        const video = document.createElement('video');
        video.srcObject = stream;
        video.autoplay = true;
        video.playsinline = true;
        video.id = consumerId;
        
        const label = document.createElement('div');
        label.className = 'video-label';
        label.textContent = `Peer ${peerId.substr(0, 8)}`;
        
        container.appendChild(video);
        container.appendChild(label);
        document.getElementById('videos').appendChild(container);
      }
      
      function removeRemoteVideo(consumerId) {
        const container = document.getElementById(`container-${consumerId}`);
        if (container) container.remove();
      }
      
      document.getElementById('muteBtn').onclick = () => {
        isAudioMuted = !isAudioMuted;
        const btn = document.getElementById('muteBtn');
        if (isAudioMuted) {
          client.muteAudio();
          btn.textContent = '🔇 Unmute';
          btn.classList.add('active');
        } else {
          client.unmuteAudio();
          btn.textContent = '🎤 Mute';
          btn.classList.remove('active');
        }
      };
      
      document.getElementById('videoBtn').onclick = () => {
        isVideoOff = !isVideoOff;
        const btn = document.getElementById('videoBtn');
        if (isVideoOff) {
          client.disableVideo();
          btn.textContent = '📹 Start Video';
          btn.classList.add('active');
        } else {
          client.enableVideo();
          btn.textContent = '📹 Stop Video';
          btn.classList.remove('active');
        }
      };
      
      document.getElementById('shareBtn').onclick = async () => {
        try {
          await client.enableScreenShare();
          alert('✅ Screen sharing started!');
        } catch (error) {
          alert('❌ Screen share error: ' + error.message);
        }
      };
      
      document.getElementById('leaveBtn').onclick = () => {
        if (confirm('Leave the meeting?')) {
          client.leave();
          location.reload();
        }
      };
      
      document.getElementById('roomIdInput').onkeypress = (e) => {
        if (e.key === 'Enter') {
          document.getElementById('joinRoomBtn').click();
        }
      };
    }
  </script>
</body>
</html>
